apiVersion: networking.k8s.io/v1
kind: Ingress
  name: web
  namespace: web-apps
spec:
  ingressClassName: traefik
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - backend:
          service:
            name: hello-world
            port:
              number: 80
        path: /
        pathType: Exact
