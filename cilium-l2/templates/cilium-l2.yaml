apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: policy1
spec:
  serviceSelector:
    matchLabels:
      service: web
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  externalIPs: true
  loadBalancerIPs: true
---
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "web-pool"
spec:
  blocks:
  - start: {{ .Values.start_cilium_vip }}
    stop: {{ .Values.stop_cilium_vip }}
  serviceSelector:
    matchLabels:
      service: web
